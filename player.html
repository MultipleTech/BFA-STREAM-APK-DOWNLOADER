<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artplayer Stream</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Outer Box: ဖုန်းမျက်နှာပြင်အလယ်တွင် ဗီဒီယိုကို လှပစွာ နေရာချပေးမည် */
        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Player Box: Video ရဲ့ Aspect Ratio (16:9) အတိုင်း ကွက်တိဖြစ်စေရန် ချိန်ထားပါသည် */
        .artplayer-app {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9; /* ဗီဒီယို ဘောင်အတိုင်း ကွက်တိဖြစ်စေပါသည် */
            max-height: 100vh;
            position: relative;
            background-image: url('YOUR_IMAGE_URL_HERE');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ညာဘက်အပေါ်ဒေါင့် Logo (BFA STREAM TV) */
        .player-logo {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        /* Marquee Box (ဗီဒီယို၏ အောက်ခြေတွင် ကွက်တိကပ်နေမည်) */
        .marquee-box {
            width: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 0;
        }

        /* Running Text (ဘယ် <-> ညာ အလှည့်ကျပြေးမည့် စာတန်း) */
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: 500;
            /* ဘယ် မှ ညာ ၊ ညာ မှ ဘယ် အလှည့်ကျ ပြေးပါမည် */
            animation: marquee-bounce 10s linear infinite alternate;
        }

        @keyframes marquee-bounce {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
    </style>
    <!-- .m3u8 (HLS) stream ဖတ်နိုင်ရန် hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Artplayer Library -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
</head>
<body>

    <div class="player-container">
        <div class="artplayer-app"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('videoUrl');

        if (!videoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။ URL parameter တွင် ?videoUrl= ထည့်သွင်းပေးပါ။</h3>';
        } else {
            const art = new Artplayer({
                container: '.artplayer-app',
                url: videoUrl,
                type: 'm3u8',
                isLive: true,
                autoplay: true,
                pip: true,
                screenshot: true,
                setting: true,
                fullscreen: true,
                fullscreenWeb: true,
                layers: [
                    // ဗီဒီယို ဘောင်၏ ညာဘက်အပေါ်ဒေါင့်တွင် ကွက်တိ ပေါ်မည့် Logo
                    {
                        name: 'topRightLogo',
                        html: '<div class="player-logo">BFA STREAM TV</div>',
                        style: {
                            position: 'absolute',
                            top: '10px',
                            right: '10px',
                            zIndex: 10,
                        },
                    },
                    // ဗီဒီယို ဘောင်၏ အောက်ခြေကွက်တိတွင် ပေါ်မည့် Marquee စာတန်း
                    {
                        name: 'bottomMarquee',
                        html: '<div class="marquee-box"><div class="marquee-text">Burmar Future Ai Apk Creation</div></div>',
                        style: {
                            position: 'absolute',
                            bottom: '0px', // ဗီဒီယိုအောက်ခြေ ကွက်တိ
                            left: '0',
                            width: '100%',
                            zIndex: 10,
                            pointerEvents: 'none',
                        },
                    }
                ],
                customType: {
                    m3u8: function (video, url, art) {
                        if (Hls.isSupported()) {
                            if (art.hls) art.hls.destroy();
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            art.hls = hls;

                            art.on('destroy', () => {
                                hls.destroy();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        } else {
                            art.notice.show = 'သင့် Browser တွင် HLS Playback မပံ့ပိုးပါ။';
                        }
                    },
                },
            });
        }
    </script>
</body>
</html>
