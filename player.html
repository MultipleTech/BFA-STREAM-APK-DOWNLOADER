<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artplayer Stream</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .artplayer-app {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- .m3u8 (HLS) stream ဖတ်နိုင်ရန် hls.js ကို သုံးပါမည် -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Artplayer Library -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
</head>
<body>

    <div class="artplayer-app"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('videoUrl');

        if (!videoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။ URL parameter တွင် ?videoUrl= ထည့်သွင်းပေးပါ။</h3>';
        } else {
            const art = new Artplayer({
                container: '.artplayer-app',
                url: videoUrl,
                type: 'm3u8',
                isLive: true,
                autoplay: true,
                pip: true,
                screenshot: true,
                setting: true,
                fullscreen: true,
                fullscreenWeb: true,
                customType: {
                    m3u8: function (video, url, art) {
                        if (Hls.isSupported()) {
                            if (art.hls) art.hls.destroy();
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            art.hls = hls;

                            art.on('destroy', () => {
                                hls.destroy();
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        } else {
                            art.notice.show = 'သင့် Browser တွင် HLS Playback မပံ့ပိုးပါ။';
                        }
                    },
                },
            });
        }
    </script>
</body>
</html>
