<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Artplayer Stream for Android TV</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .artplayer-app,
        #artplayer,
        .art-video-player,
        .art-video-player video {
            width: 100vw !important;
            height: 100vh !important;
            position: relative;
            outline: none;
            background: transparent !important;
            background-color: transparent !important;
            object-fit: contain !important;
        }

        .player-logo {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        .marquee-box {
            width: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 0;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            will-change: transform;
            animation: marquee-bounce 12s linear infinite alternate;
        }

        @keyframes marquee-bounce {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>

    <!-- HLS Library (Stable Release) -->
    <script src="hls.min.js"></script>
    
    <!-- FLV Library -->
    <script src="flv.min.js"></script>

    <!-- Artplayer Library -->
    <script src="artplayer.js"></script>
</head>
<body>

    <div class="player-container">
        <div id="artplayer" class="artplayer-app" tabindex="0"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawVideoUrl = urlParams.get('videoUrl');

        if (!rawVideoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။ URL parameter တွင် ?videoUrl= ထည့်သွင်းပေးပါ။</h3>';
        } else {
            let videoUrl = decodeURIComponent(rawVideoUrl).split('|')[0].trim();
            let titleParam = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : 'BFA STREAM TV';

            let streamType = 'mp4'; 
            const cleanCheckUrl = videoUrl.split('?')[0].toLowerCase();
            
            if (cleanCheckUrl.endsWith('.flv') || cleanCheckUrl.includes('.flv')) {
                streamType = 'flv';
            } else if (cleanCheckUrl.endsWith('.m3u8') || cleanCheckUrl.includes('.m3u8')) {
                streamType = 'm3u8';
            } else if (cleanCheckUrl.endsWith('.mp4') || cleanCheckUrl.includes('.mp4')) {
                streamType = 'mp4';
            }

            // TV Live Channel မဟုတ်ပါက isLive ကို false ထားရပါမည် (မဟုတ္ပါက m3u8 VOD ဖတ္မရပါ)
            const isLiveStream = urlParams.get('isLive') === 'true' || streamType === 'flv';

            const artConfig = {
                container: '#artplayer',
                url: videoUrl,
                type: streamType,
                isLive: isLiveStream,
                autoplay: true,
                muted: true,
                hotkey: true,
                fullscreen: true,
                fullscreenWeb: true,
                layers: [
                    {
                        name: 'topRightLogo',
                        html: `<div class="player-logo">${titleParam}</div>`,
                        style: {
                            position: 'absolute',
                            top: '15px',
                            right: '15px',
                            zIndex: 10,
                        },
                    },
                    {
                        name: 'bottomMarquee',
                        html: '<div class="marquee-box"><div class="marquee-text">Burmar Future Ai Stream</div></div>',
                        style: {
                            position: 'absolute',
                            bottom: '0px',
                            left: '0',
                            width: '100%',
                            zIndex: 10,
                            pointerEvents: 'none',
                        },
                    }
                ],
                customType: {
                    m3u8: function (video, url, art) {
                        if (Hls.isSupported()) {
                            if (art.hls) art.hls.destroy();
                            const hls = new Hls({
                                enableWorker: false, // Android TV WebView compatibility
                                maxBufferLength: 30,
                                maxMaxBufferLength: 60,
                            });
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            art.hls = hls;

                            // M3U8 Manifest ဖတ်ပြီးပါက တန်း play ပေးခြင်း
                            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                                art.play().catch(() => {});
                            });

                            // Network/Buffer Error များအတွက် Auto Recovery
                            hls.on(Hls.Events.ERROR, (event, data) => {
                                if (data.fatal) {
                                    switch (data.type) {
                                        case Hls.ErrorTypes.NETWORK_ERROR:
                                            hls.startLoad();
                                            break;
                                        case Hls.ErrorTypes.MEDIA_ERROR:
                                            hls.recoverMediaError();
                                            break;
                                        default:
                                            hls.destroy();
                                            break;
                                    }
                                }
                            });

                            art.on('destroy', () => hls.destroy());
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        }
                    },
                    flv: function (video, url, art) {
                        if (flvjs.isSupported()) {
                            if (art.flv) art.flv.destroy();
                            const flvPlayer = flvjs.createPlayer({
                                type: 'flv',
                                url: url,
                                isLive: true,
                            }, {
                                cors: true,
                                enableStashBuffer: false,
                                lazyLoad: false,
                            });
                            flvPlayer.attachMediaElement(video);
                            flvPlayer.load();
                            art.flv = flvPlayer;
                            art.on('destroy', () => flvPlayer.destroy());
                        }
                    }
                }
            };

            const art = new Artplayer(artConfig);

            art.on('ready', () => {
                if (art.video) {
                    art.video.setAttribute('playsinline', 'true');
                    art.video.setAttribute('webkit-playsinline', 'true');
                    art.video.style.backgroundColor = 'transparent';
                }

                art.focus = true;
                const playerEl = document.getElementById('artplayer');
                if (playerEl) playerEl.focus();

                art.play().then(() => {
                    setTimeout(() => { art.muted = false; }, 500);
                }).catch(() => {});
            });

            // Remote Controller Key Mapping
            document.addEventListener('keydown', (e) => {
                switch (e.keyCode) {
                    case 13:
                    case 32:
                        art.toggle();
                        break;
                    case 37:
                        if (!art.isLive) art.seek = Math.max(0, art.currentTime - 10);
                        break;
                    case 39:
                        if (!art.isLive) art.seek = Math.min(art.duration, art.currentTime + 10);
                        break;
                    case 38:
                        art.volume = Math.min(1, art.volume + 0.1);
                        break;
                    case 40:
                        art.volume = Math.max(0, art.volume - 0.1);
                        break;
                }
            });
        }
    </script>
</body>
</html>
