<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referer Block ကျော်ရန် no-referrer ထည့်သွင်းထားသည် -->
    <meta name="referrer" content="no-referrer">
    <title>Artplayer Stream for Android TV</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TV Screen အတွက် Full Viewport အပြည့်ယူခြင်း */
        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .artplayer-app {
            width: 100vw;
            height: 100vh;
            position: relative;
            outline: none; /* Focus border ကို ဖျောက်ရန် */
        }

        /* ညာဘက်အပေါ်ဒေါင့် Logo */
        .player-logo {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        /* Marquee Box */
        .marquee-box {
            width: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 0;
        }

        /* Performance Optimized Running Text */
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            will-change: transform;
            animation: marquee-bounce 12s linear infinite alternate;
        }

        @keyframes marquee-bounce {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
    </style>

    <!-- HLS Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- FLV Library -->
    <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>

    <!-- Artplayer Library -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
</head>
<body>

    <div class="player-container">
        <div id="artplayer" class="artplayer-app" tabindex="0"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawVideoUrl = urlParams.get('videoUrl');

        if (!rawVideoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။ URL parameter တွင် ?videoUrl= ထည့်သွင်းပေးပါ။</h3>';
        } else {
            // URL decode ပြုလုပ်ခြင်း နှင့် Pipe (|Referer) ပါလာပါက ဖျောက်ခြင်း
            let videoUrl = decodeURIComponent(rawVideoUrl).split('|')[0].trim();
            let titleParam = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : 'BFA STREAM TV';

            // Video Format ခွဲခြားခြင်း (MP4, M3U8, FLV)
            let streamType = 'mp4'; 
            const cleanCheckUrl = videoUrl.split('?')[0].toLowerCase();
            
            if (cleanCheckUrl.endsWith('.flv') || cleanCheckUrl.includes('.flv')) {
                streamType = 'flv';
            } else if (cleanCheckUrl.endsWith('.m3u8') || cleanCheckUrl.includes('.m3u8')) {
                streamType = 'm3u8';
            } else if (cleanCheckUrl.endsWith('.mp4') || cleanCheckUrl.includes('.mp4')) {
                streamType = 'mp4';
            }

            const artConfig = {
                container: '#artplayer',
                url: videoUrl,
                type: streamType,
                isLive: streamType === 'flv' || streamType === 'm3u8',
                autoplay: true,
                muted: true, // Android TV Autoplay ရစေရန်
                hotkey: true,
                fullscreen: true,
                fullscreenWeb: true,
                layers: [
                    {
                        name: 'topRightLogo',
                        html: `<div class="player-logo">${titleParam}</div>`,
                        style: {
                            position: 'absolute',
                            top: '15px',
                            right: '15px',
                            zIndex: 10,
                        },
                    },
                    {
                        name: 'bottomMarquee',
                        html: '<div class="marquee-box"><div class="marquee-text">Burmar Future Ai Stream</div></div>',
                        style: {
                            position: 'absolute',
                            bottom: '0px',
                            left: '0',
                            width: '100%',
                            zIndex: 10,
                            pointerEvents: 'none',
                        },
                    }
                ],
                customType: {}
            };

            // Custom Loader များ (HLS / FLV အတွက်သာ သီးသန့်ထည့်ရန်)
            if (streamType === 'm3u8') {
                artConfig.customType.m3u8 = function (video, url, art) {
                    if (Hls.isSupported()) {
                        if (art.hls) art.hls.destroy();
                        const hls = new Hls({
                            maxBufferLength: 10,
                            liveSyncDuration: 3,
                        });
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        art.hls = hls;
                        art.on('destroy', () => hls.destroy());
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                };
            } else if (streamType === 'flv') {
                artConfig.customType.flv = function (video, url, art) {
                    if (flvjs.isSupported()) {
                        if (art.flv) art.flv.destroy();
                        const flvPlayer = flvjs.createPlayer({
                            type: 'flv',
                            url: url,
                            isLive: true,
                        }, {
                            cors: true,
                            enableStashBuffer: false,
                            lazyLoad: false,
                        });
                        flvPlayer.attachMediaElement(video);
                        flvPlayer.load();
                        art.flv = flvPlayer;
                        art.on('destroy', () => flvPlayer.destroy());
                    }
                };
            }

            const art = new Artplayer(artConfig);

            // Video စဖွင့်သည်နှင့် Unmute ပြုလုပ်ခြင်း
            art.on('ready', () => {
                art.focus = true;
                const playerEl = document.getElementById('artplayer');
                if (playerEl) playerEl.focus();

                art.play().then(() => {
                    setTimeout(() => { art.muted = false; }, 500);
                }).catch(() => {});
            });

            // Android TV Remote Control Key Bindings
            document.addEventListener('keydown', (e) => {
                switch (e.keyCode) {
                    case 13: // OK / Center Button
                    case 32: // Space bar
                        art.toggle();
                        break;
                    case 37: // Left Arrow (Rewind 10s)
                        if (!art.isLive) art.seek = Math.max(0, art.currentTime - 10);
                        break;
                    case 39: // Right Arrow (Fast Forward 10s)
                        if (!art.isLive) art.seek = Math.min(art.duration, art.currentTime + 10);
                        break;
                    case 38: // Up Arrow (Volume Up)
                        art.volume = Math.min(1, art.volume + 0.1);
                        break;
                    case 40: // Down Arrow (Volume Down)
                        art.volume = Math.max(0, art.volume - 0.1);
                        break;
                }
            });
        }
    </script>
</body>
</html>
