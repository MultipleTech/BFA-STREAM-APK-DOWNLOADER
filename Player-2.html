<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referer Block ကျော်ရန် -->
    <meta name="referrer" content="no-referrer">
    <title>Clappr Player for Android TV</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        /* TV Box WebView Black Screen Fix - Background Transparent သတ်မှတ်ခြင်း */
        #player,
        [data-player],
        .container[data-container],
        video {
            width: 100vw !important;
            height: 100vh !important;
            background: transparent !important;
            background-color: transparent !important;
            object-fit: contain !important;
        }

        /* Marquee Box Overlay (အပေါ်ဆုံးသို့ ပြောင်းထားသည်) */
        .marquee-box {
            position: absolute;
            top: 0px;
            left: 0;
            width: 100%;
            z-index: 20;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 0;
            pointer-events: none;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            will-change: transform;
            animation: marquee-bounce 12s linear infinite alternate;
        }

        @keyframes marquee-bounce {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ညာဘက်အပေါ်ဒေါင့် Logo Overlay (Marquee Box အောက်သို့ အနည်းငယ် ရွှေ့ပေးထားသည်) */
        .player-logo {
            position: absolute;
            top: 35px;
            right: 15px;
            z-index: 20;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
            pointer-events: none;
        }
    </style>

    <!-- Clappr Core Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
</head>
<body>

    <div class="player-container">
        <!-- Marquee Box Overlay (အပေါ်ဘက်) -->
        <div class="marquee-box">
            <div class="marquee-text">Burmar Future Ai Stream</div>
        </div>

        <!-- ညာဘက်အပေါ်ဒေါင့် Logo Overlay -->
        <div id="player-logo" class="player-logo">BFA STREAM TV</div>

        <!-- Clappr Player Container -->
        <div id="player"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawVideoUrl = urlParams.get('videoUrl');

        if (!rawVideoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။ URL parameter တွင် ?videoUrl= ထည့်သွင်းပေးပါ။</h3>';
        } else {
            let videoUrl = decodeURIComponent(rawVideoUrl).split('|')[0].trim();
            let titleParam = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : 'BFA STREAM TV';

            document.getElementById('player-logo').innerText = titleParam;

            // Clappr Player Initialize ပြုလုပ်ခြင်း
            const player = new Clappr.Player({
                source: videoUrl,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                mute: true,
                playback: {
                    playInline: true,
                    recycleVideo: true
                }
            });

            // Player Ready ဖြစ်ပါက Video Element Background ကို Transparent ပြောင်းပြီး Auto Unmute ပြုလုပ်ခြင်း
            player.on(Clappr.Events.PLAYER_READY, function() {
                const videoElement = player.core.activeContainer.el.querySelector('video');
                if (videoElement) {
                    videoElement.setAttribute('playsinline', 'true');
                    videoElement.setAttribute('webkit-playsinline', 'true');
                    videoElement.style.backgroundColor = 'transparent';
                }

                player.play();
                setTimeout(() => { 
                    player.unmute(); 
                }, 500);
            });

            // Android TV Remote Control Key Bindings (D-Pad)
            document.addEventListener('keydown', (e) => {
                switch (e.keyCode) {
                    case 13: // OK / Center Button
                    case 32: // Spacebar
                        if (player.isPlaying()) {
                            player.pause();
                        } else {
                            player.play();
                        }
                        break;
                    case 37: // Left Arrow (Rewind 10s)
                        player.seek(Math.max(0, player.getCurrentTime() - 10));
                        break;
                    case 39: // Right Arrow (Fast Forward 10s)
                        player.seek(Math.min(player.getDuration(), player.getCurrentTime() + 10));
                        break;
                    case 38: // Up Arrow (Volume Up 10%)
                        player.setVolume(Math.min(100, player.getVolume() + 10));
                        break;
                    case 40: // Down Arrow (Volume Down 10%)
                        player.setVolume(Math.max(0, player.getVolume() - 10));
                        break;
                }
            });
        }
    </script>
</body>
</html>
