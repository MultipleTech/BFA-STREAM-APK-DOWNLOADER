<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Clappr Player for Android TV</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #player,
        [data-player],
        .container[data-container],
        video {
            width: 100vw !important;
            height: 100vh !important;
            background: transparent !important;
            background-color: transparent !important;
            object-fit: contain !important;
        }

        /* Marquee Box Overlay (အပေါ်ဆုံး) */
        .marquee-box {
            position: absolute;
            top: 0px;
            left: 0;
            width: 100%;
            z-index: 20;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 0;
            pointer-events: none;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            will-change: transform;
            animation: marquee-bounce 12s linear infinite alternate;
        }

        @keyframes marquee-bounce {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

    </style>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
</head>
<body>

    <div class="player-container">
        <div class="marquee-box">
            <div class="marquee-text">Burmar Future Ai Stream</div>
        </div>

        <div id="player"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawVideoUrl = urlParams.get('videoUrl');

        if (!rawVideoUrl) {
            document.body.innerHTML = '<h3 style="color: #fff; font-family: sans-serif; text-align: center;">Video URL မတွေ့ရှိပါ။</h3>';
        } else {
            let videoUrl = decodeURIComponent(rawVideoUrl).split('|')[0].trim();
            // Clappr Player Config
            const player = new Clappr.Player({
                source: videoUrl,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                mute: false, // အသံတန်းထွက်စေရန် false ထားပါသည်
                playback: {
                    playInline: true,
                    recycleVideo: true
                }
            });

            player.on(Clappr.Events.PLAYER_READY, function() {
                const videoElement = player.core.activeContainer.el.querySelector('video');
                if (videoElement) {
                    videoElement.setAttribute('playsinline', 'true');
                    videoElement.setAttribute('webkit-playsinline', 'true');
                    videoElement.style.backgroundColor = 'transparent';
                    videoElement.muted = false; // Video tag ၏ muted ကိုပါ false လုပ်ခြင်း
                }

                // Autoplay ပွင့်အောင် တိုက်ရိုက် ခေါ်ယူခြင်း
                try {
                    player.setVolume(100);
                    player.unmute();
                    player.play();
                } catch (e) {
                    console.log("Autoplay error:", e);
                }
            });

            // Browser/WebView Autoplay Policy ကြောင့် အသံပိတ်သွားပါက Remote ခလုတ် ၁ ချက်နှိပ်လိုက်သည်နှင့် အသံတန်းပွင့်စေရန်
            const unlockAudio = () => {
                if (player) {
                    player.unmute();
                    player.setVolume(100);
                    const videoElement = player.core.activeContainer.el.querySelector('video');
                    if (videoElement) videoElement.muted = false;
                }
                document.removeEventListener('keydown', unlockAudio);
            };
            document.addEventListener('keydown', unlockAudio);

            // Remote Controller Key Mapping
            document.addEventListener('keydown', (e) => {
                switch (e.keyCode) {
                    case 13:
                    case 32:
                        if (player.isPlaying()) {
                            player.pause();
                        } else {
                            player.play();
                        }
                        break;
                    case 37:
                        player.seek(Math.max(0, player.getCurrentTime() - 10));
                        break;
                    case 39:
                        player.seek(Math.min(player.getDuration(), player.getCurrentTime() + 10));
                        break;
                    case 38:
                        player.setVolume(Math.min(100, player.getVolume() + 10));
                        break;
                    case 40:
                        player.setVolume(Math.max(0, player.getVolume() - 10));
                        break;
                }
            });
        }
    </script>
</body>
</html>
