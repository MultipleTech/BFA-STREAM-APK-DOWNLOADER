<!DOCTYPE html>

</head>
<body>

  <center>
    <button onclick="handleNavigation('/')"
      class="btn-11 custom-btn"
      style="width: 100%; font-weight: 1000; font-size: 20px; position: sticky; top: 0px; z-index: 3; font-family: Lucida Sans Unicode; line-height: 1rem;">
      Bigcash PLAYER
    </button>
  </center>

  <!-- Player Container -->
  <div id="player" class="My-Player"></div>

  <!-- Modified Player Script -->
  <script src="player.js" type="text/javascript"></script>
  <script type="text/javascript">
    // WebView နဲ့အလုပ်လုပ်ဖို့ Function
    function handleNavigation(url) {
      if(typeof AndroidBridge !== 'undefined') {
        // Android WebView အတွက်
        AndroidBridge.loadUrl(url);
      } else if(window.webkit && window.webkit.messageHandlers.iosBridge) {
        // iOS WebView အတွက်
        window.webkit.messageHandlers.iosBridge.postMessage(url);
      } else {
        // ပုံမှန် Browser အတွက်
        window.location.href = url;
      }
    }

    // Video Player Initialization
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('videoUrl');

    if(videoUrl){
      Playerjs({
        id: "player",
        file: videoUrl,
        autoplay: 1,
        poster: "https://i.postimg.cc/TPGR0t27/share4it.jpg",
        // WebView Friendly Configuration
        androidhls: true,
        crossorigin: "anonymous"
      });
    } else {
      document.getElementById("player").innerHTML = "<h3 style='color: red;'>Video URL Not Found!</h3>";
    }
  </script>

  <br>

      <div class="container">
        <img class="card1" src="https://i.postimg.cc/rmDg5bgr/1747605442397-pic.png" />

  </center>

  </center>

</body>
