<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M SPORT TV PLAYER</title>
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e1e1e, #2c3e50);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
        }

        .custom-btn {
            background: linear-gradient(45deg, var(--secondary-color), var(--accent-color));
            border: none;
            padding: 15px 30px;
            color: white;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .custom-btn:hover, .custom-btn:focus {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            outline: none;
        }

        .player-container {
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #1a1a1a;
            position: relative;
        }

        #player {
            width: 100%;
            height: 600px;
            border: none;
            transition: transform 0.3s;
        }

        .player-controls {
            padding: 15px;
            background: rgba(0,0,0,0.8);
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .control-btn {
            padding: 10px 20px;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            min-width: 120px;
        }

        .control-btn:hover, .control-btn:focus {
            background: var(--secondary-color);
            transform: scale(1.05);
            outline: 3px solid rgba(255,255,255,0.3);
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--secondary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .video-title {
            text-align: center;
            margin: 15px 0;
            font-size: 1.5em;
            color: var(--secondary-color);
        }

        /* TV Optimized Styles */
        @media (min-width: 1280px) {
            .control-btn {
                font-size: 20px;
                padding: 15px 25px;
                min-width: 150px;
            }
            
            #player {
                height: 700px;
            }
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            #player {
                height: 400px;
            }
            
            .custom-btn {
                padding: 12px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button onclick="window.location.href='/'" class="custom-btn">
            🎬 M SPORT TV PLAYER
        </button>
    </div>

    <div class="player-container">
        <div class="loading-spinner"></div>
        <div id="player" class="My-Player"></div>
        <div class="player-controls">
            <button class="control-btn" onclick="togglePlay()">⏯️ Play/Pause</button>
            <button class="control-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="control-btn" onclick="toggleVolume()">🔊 Volume Toggle</button>
        </div>
        <div class="video-title" id="videoTitle"></div>
    </div>

    <script src="https://msportmm.vercel.app/myjs/player.js" type="text/javascript"></script>
    
    <script>
        // Initialize Player
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('videoUrl');
        let player;

        function initializePlayer() {
            player = Playerjs({
                id: "player",
                file: videoUrl,
                poster: "https://i.imgur.com/T4i6UFD.jpg",
                autoplay: true,
                title: "M SPORT HD STREAM",
                css: {
                    control: {
                        background: "rgba(0,0,0,0.8)",
                        color: "#ffffff"
                    }
                }
            });

            // Player Events
            player.on('ready', () => {
                document.querySelector('.loading-spinner').style.display = 'none';
                document.getElementById('videoTitle').textContent = player.config.title;
                setupTVControls();
            });

            player.on('waiting', () => {
                document.querySelector('.loading-spinner').style.display = 'block';
            });

            player.on('error', (err) => {
                alert('Player Error: ' + err.message);
                document.querySelector('.loading-spinner').style.display = 'none';
            });
        }

        // Control Functions
        function togglePlay() {
            player.api(player.api('paused') ? 'play' : 'pause');
        }

        function toggleFullscreen() {
            player.api('fullscreen');
        }

        function toggleVolume() {
            const currentVolume = player.api('volume');
            player.api('volume', currentVolume > 0 ? 0 : 1);
        }

        // Android TV Remote Control Support
        function setupTVControls() {
            let currentFocusIndex = 0;
            const focusableElements = document.querySelectorAll('.control-btn, .custom-btn');

            // Add TV Navigation Attributes
            focusableElements.forEach((el, index) => {
                el.setAttribute('tabindex', index + 1);
            });

            // Key Event Handler
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp':
                        currentFocusIndex = Math.max(0, currentFocusIndex - 1);
                        break;
                    case 'ArrowDown':
                        currentFocusIndex = Math.min(focusableElements.length - 1, currentFocusIndex + 1);
                        break;
                    case 'ArrowLeft':
                        player.api('seek', player.api('time') - 10);
                        break;
                    case 'ArrowRight':
                        player.api('seek', player.api('time') + 10);
                        break;
                    case 'Enter':
                        focusableElements[currentFocusIndex].click();
                        break;
                    case 'Backspace':
                        window.history.back();
                        break;
                    case 'MediaPlayPause':
                        togglePlay();
                        break;
                    case 'VolumeUp':
                        player.api('volume', Math.min(1, player.api('volume') + 0.1));
                        break;
                    case 'VolumeDown':
                        player.api('volume', Math.max(0, player.api('volume') - 0.1));
                        break;
                }
                focusableElements[currentFocusIndex].focus();
            });
        }

        // Initialize
        initializePlayer();
    </script>
</body>
</html>
